plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven { url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"goofy-viberotations" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modRuntimeOnly("me.djtheredstoner:DevAuth-fabric:1.2.2")

	// Unit testing
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Give the test source set access to client classes and Minecraft classpath
sourceSets {
	test {
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Offline rotation-engine harness: ./gradlew harness -Pcount=2000 -Pseed=1 -Pparams="durSigma=0.4"
tasks.register('harness', JavaExec) {
	group = 'verification'
	description = 'Runs the rotation engine offline and writes frames.csv to build/harness'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.goofy.viberotations.engine.RotationHarness'
	args = [
		"--out=${layout.buildDirectory.dir('harness').get().asFile}",
		"--count=${project.findProperty('count') ?: 2000}",
		"--seed=${project.findProperty('seed') ?: 1}",
		"--params=${project.findProperty('params') ?: ''}",
		"--reaction=${project.findProperty('reaction') ?: ''}"
	]
}

// Prints the runtime classpath so analysis/tune.py can launch the harness without Gradle overhead.
tasks.register('printHarnessClasspath') {
	doLast { println sourceSets.main.runtimeClasspath.asPath }
}
